name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: docker build -t yt2wa:${{ github.ref_name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
