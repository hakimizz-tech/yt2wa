[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2wa"
version = "0.1.0"
description = "Download YouTube videos and convert them for WhatsApp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["yt-dlp>=2024.8.6"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "pip-audit>=2.7",
]

[project.scripts]
yt2wa = "yt2wa.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt2wa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m 'not network'"
markers = [
    "network: needs internet access",
    "ffmpeg: needs ffmpeg installed",
]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "D"]
# D1 = "missing docstring" rules. Docstrings are short and optional.
ignore = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["yt2wa", "fakes"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yt_dlp.*"
ignore_missing_imports = true

[tool.importlinter]
root_package = "yt2wa"

[[tool.importlinter.contracts]]
name = "Domain does not depend on outer layers"
type = "forbidden"
source_modules = ["yt2wa.domain"]
forbidden_modules = [
    "yt2wa.application",
    "yt2wa.infrastructure",
    "yt2wa.interface",
    "yt2wa.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Application depends on the domain only"
type = "forbidden"
source_modules = ["yt2wa.application"]
forbidden_modules = [
    "yt2wa.infrastructure",
    "yt2wa.interface",
    "yt2wa.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on outer layers"
type = "forbidden"
source_modules = ["yt2wa.infrastructure"]
forbidden_modules = [
    "yt2wa.application",
    "yt2wa.interface",
    "yt2wa.bootstrap",
]
